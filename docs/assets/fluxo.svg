<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
  <title id="t">Fluxo principal do SinalPlus</title>
  <desc id="d">Atendimento concluído, pesquisa enviada ao cliente, avaliação em barras de sinal, pontos para o colaborador e resgate de prêmio.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="230" rx="16" fill="#f8fafc"/>
  <g font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <rect x="20" y="50" width="196" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="118" y="88" font-size="15" font-weight="700" fill="#0f172a">1. Atendimento</text>
    <text x="118" y="114" font-size="13" fill="#475569">O.S. ou chamado concluído</text>
    <text x="118" y="134" font-size="13" fill="#475569">no IXC, SGP ou manual</text>
    <!-- 2 -->
    <rect x="256" y="50" width="196" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="354" y="88" font-size="15" font-weight="700" fill="#0f172a">2. Pesquisa</text>
    <text x="354" y="114" font-size="13" fill="#475569">Link assinado por</text>
    <text x="354" y="134" font-size="13" fill="#475569">WhatsApp, SMS ou e-mail</text>
    <!-- 3 -->
    <rect x="492" y="50" width="196" height="120" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="590" y="80" font-size="15" font-weight="700" fill="#0f172a">3. Avaliação</text>
    <g transform="translate(548 140)">
      <rect x="0"  y="-12" width="12" height="12" rx="2" fill="#ef4444"/>
      <rect x="18" y="-20" width="12" height="20" rx="2" fill="#f97316"/>
      <rect x="36" y="-28" width="12" height="28" rx="2" fill="#eab308"/>
      <rect x="54" y="-36" width="12" height="36" rx="2" fill="#84cc16"/>
      <rect x="72" y="-44" width="12" height="44" rx="2" fill="#22c55e"/>
    </g>
    <text x="590" y="160" font-size="12" fill="#475569">1 a 5 barras de sinal</text>
    <!-- 4 -->
    <rect x="728" y="50" width="196" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="826" y="88" font-size="15" font-weight="700" fill="#0f172a">4. Pontos</text>
    <text x="826" y="114" font-size="13" fill="#475569">+10 a −10 no ledger,</text>
    <text x="826" y="134" font-size="13" fill="#475569">níveis, selos e ranking</text>
    <!-- 5 -->
    <rect x="964" y="50" width="196" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1062" y="88" font-size="15" font-weight="700" fill="#0f172a">5. Prêmio</text>
    <text x="1062" y="114" font-size="13" fill="#475569">Resgate aprovado pelo</text>
    <text x="1062" y="134" font-size="13" fill="#475569">gestor, baixa de estoque</text>

    <text x="590" y="205" font-size="13" fill="#b91c1c">Nota 1–2 barras abre um caso de recuperação para o gestor</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#seta)">
    <line x1="218" y1="110" x2="252" y2="110"/>
    <line x1="454" y1="110" x2="488" y2="110"/>
    <line x1="690" y1="110" x2="724" y2="110"/>
    <line x1="926" y1="110" x2="960" y2="110"/>
  </g>
</svg>
